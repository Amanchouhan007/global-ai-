<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="fav-emerald" x1="4" y1="8" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D5C3A"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="fav-rose" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
  </defs>

  <!-- Dynamic Orbit -->
  <g transform="rotate(-28 24 24)">
    <ellipse cx="24" cy="24" rx="20" ry="8.5" stroke="url(#fav-emerald)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="44" cy="24" r="3.2" fill="#D81B60"/>
    <circle cx="44" cy="24" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Clinical Cross Core -->
  <rect x="20.5" y="11" width="7" height="26" rx="3.5" fill="#0D5C3A" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="11" y="20.5" width="26" height="7" rx="3.5" fill="#0D5C3A" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Rose Center Pulse -->
  <circle cx="24" cy="24" r="4.2" fill="url(#fav-rose)"/>
  <circle cx="24" cy="24" r="1.8" fill="#FFFFFF"/>
</svg>
